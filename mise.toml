#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.9"

[tools]
bun = "1.4.4"
node = "27.0.0-alpha.0.0.0"
"npm:typescript" = "7.0.2"
"npm:semantic-release" = "25.0.9"
hk = "2.9.0"
oxlint = "1.72.0"
oxfmt = "0.75.0"
jactionlint = "v2.3.0"
# required for jactionlint's workflow shell checks
shellcheck = "0.11.0"
ghalint = "1.5.7"
pinact = "5.0.2"
zizmor = "1.31.1"
tombi = "1.9.7"
rumdl = "v0.3.2"
yamlfmt = "0.21.0"
# required for pypi backend
uv = "0.13.6"
yamllint = "1.38.0"
typos = "1.51.1"

[settings]
experimental = true
lockfile = true
lockfile_mode = "generate"

[settings.npm]
package_manager = "bun"

[deps.bun]
auto = true
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]
run = "bun install --frozen-lockfile"

[tasks.test]
description = "Run repository Bun tests."
run = "bun test"

[tasks.test-e2e]
description = "Run browser-backed Bun e2e tests."
run = '''
if command -v xvfb-run >/dev/null 2>&1; then
  xvfb-run -a bun test tests/e2e
else
  bun test tests/e2e
fi
'''

[tasks.check]
description = "Run hk linters and formatters."
usage = '''
flag "--lint" help="Run hk check instead of fix"
'''
run = "hk {% if usage.lint %}check{% else %}fix{% endif %} --all --no-progress --no-fail-fast"
