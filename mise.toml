#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.19"

[tools]
bun = "1.4.5"
node = "26.13.1"
"npm:typescript" = "7.0.2"
"npm:semantic-release" = "26.0.1"
hk = "2.13.0"
oxlint = "1.72.0"
oxfmt = "0.75.0"
jactionlint = "v2.6.0"
# required for jactionlint's workflow shell checks
shellcheck = "0.11.0"
ghalint = "1.6.0"
pinact = "5.0.2"
zizmor = "1.32.0"
tombi = "1.11.3"
rumdl = "v0.3.5"
yamlfmt = "0.21.0"
# required for pypi backend
uv = "0.13.8"
yamllint = "1.38.0"
typos = "1.52.2"

[settings]
experimental = true
lockfile = true

[settings.npm]
package_manager = "bun"

[deps.bun]
auto = true
run = "bun install --frozen-lockfile"

[tasks.test]
description = "Run repository Bun tests."
run = "bun test"

[tasks.test-e2e]
description = "Run browser-backed Bun e2e tests."
run = '''
if command -v xvfb-run >/dev/null 2>&1; then
  xvfb-run -a bun test tests/e2e
else
  bun test tests/e2e
fi
'''

[tasks.check]
description = "Run hk linters and formatters."
usage = '''
flag "--lint" help="Run hk check instead of fix"
'''
run = "hk {% if usage.lint %}check{% else %}fix{% endif %} --all --no-progress --no-fail-fast"
